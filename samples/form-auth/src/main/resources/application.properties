quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.landing-page=/account
quarkus.http.auth.permission.account.paths=/account
quarkus.http.auth.permission.account.policy=authenticated

quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.alice=secret
quarkus.security.users.embedded.roles.alice=user

# No quarkus.http.auth.session.encryption-key: each instance generates its own at startup, with a warning. The
# login cookie one instance issues is garbage to every other instance.
