quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true

# The database accepts 12 connections in all. Dev Services makes the application user the superuser, so none of
# them are held back by superuser_reserved_connections; with an ordinary user, subtract those (3 by default).
quarkus.datasource.devservices.command=postgres -c max_connections=12

# A pool of 8 connections, all opened at startup, sized as if this were the only instance. Two instances want 16
# of the 12: the first to start takes its 8, the second gets the 4 that are left and goes on reporting ready.
quarkus.datasource.jdbc.min-size=8
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.initial-size=8
# how long a request waits for a connection before it fails
quarkus.datasource.jdbc.acquisition-timeout=1S
