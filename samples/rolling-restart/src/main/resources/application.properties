# in-flight requests get this long to finish once shutdown starts
quarkus.shutdown.timeout=PT10S
# build-time switch; the delay itself (quarkus.shutdown.delay) is runtime configuration and is left unset here:
# on SIGTERM the instance stops accepting connections at once, while the load balancer keeps sending it new
# ones until the endpoint change has propagated
quarkus.shutdown.delay-enabled=true
