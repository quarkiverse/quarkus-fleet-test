quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true

mp.messaging.outgoing.orders-out.connector=smallrye-kafka
mp.messaging.outgoing.orders-out.topic=orders
mp.messaging.incoming.orders.connector=smallrye-kafka
mp.messaging.incoming.orders.topic=orders
mp.messaging.incoming.orders.group.id=order-processors
mp.messaging.incoming.orders.auto.offset.reset=earliest
# the group notices a dead member after this long; Kafka's default is 45 seconds
mp.messaging.incoming.orders.session.timeout.ms=6000
mp.messaging.incoming.orders.heartbeat.interval.ms=2000
# offsets are committed this long after a record was processed; Kafka's default is 5 seconds. A crash inside
# that window means the records are delivered again to whoever gets the partition next, whatever the interval.
mp.messaging.incoming.orders.auto.commit.interval.ms=30000
# one partition: one instance consumes, the other waits, and a crash moves the partition over
quarkus.kafka.devservices.topic-partitions.orders=1
