quarkus.oidc.application-type=web-app
# PKCE, as every provider recommends. The code verifier travels in the state cookie, which is therefore encrypted.
quarkus.oidc.authentication.pkce-required=true
quarkus.http.auth.permission.profile.paths=/profile
quarkus.http.auth.permission.profile.policy=authenticated

# No quarkus.oidc.authentication.state-secret. The key that encrypts the state cookie is derived from the client
# secret when that is at least 32 characters long; otherwise each instance generates its own at startup. Keycloak
# Dev Services registers the client with the secret "secret", so the login started on one instance cannot be
# finished on another.
